spring.application.name=NQD_LMS_BE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_learning_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Docker Compose auto-override to use local PostgreSQL
spring.docker.compose.enabled=false

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# TIMEZONE & DATE-TIME CONFIGURATION (Vietnam GMT+7)
# ============================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.hikari.connection-init-sql=SET timezone = 'Asia/Ho_Chi_Minh'


# ============================================================
# VIRTUAL THREADS & HIGH-CONCURRENCY WEB SERVER (JDK 21)
# ============================================================
spring.threads.virtual.enabled=true

# Embedded Tomcat High-Throughput & I/O Tuning
server.tomcat.max-connections=100000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ============================================================
# HIKARICP DATABASE CONNECTION POOL OPTIMIZATIONS
# ============================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=NqdHikariCP-VThreadPool
spring.datasource.hikari.auto-commit=true


# Google OAuth 2.0 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend URL
app.frontend.url=${FRONTEND_URL:https://nqdlms.online}

# Reverse Proxy & SSL Termination (Required for Render & Cloudflare)
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Session Management & Cross-Site Cookies (Required for Vercel Frontend + Render Backend)
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# JWT Authentication Configuration (7 days expiration)
app.jwt.secret=${JWT_SECRET:nqd-lms-super-secret-key-for-jwt-signing-at-least-256-bits-long-2026}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# ============================================================
# AI & LLM PROVIDER CONFIGURATION (LangChain4j)
# ============================================================
# Provider Mode: AUTO (auto-detects Gemini / OpenAI key, falls back to offline generator), GEMINI, OPENAI, MOCK_FALLBACK
lms.ai.provider=${LMS_AI_PROVIDER:AUTO}

# 1. Google Gemini API Configuration
lms.ai.gemini.api-key=${GEMINI_API_KEY:}
lms.ai.gemini.model-name=${GEMINI_MODEL:gemini-1.5-flash}

# 2. OpenAI / DeepSeek / Groq / OpenRouter / Local Ollama Configuration
lms.ai.langchain4j.api-key=${OPENAI_API_KEY:}
lms.ai.langchain4j.model-name=${OPENAI_MODEL:gpt-4o-mini}
lms.ai.langchain4j.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ============================================================
# BILLING & PAYMENT GATEWAYS CONFIGURATION (SePay / VietQR / PayOS)
# ============================================================
payment.provider=${PAYMENT_PROVIDER:SEPAY}
payment.client-id=${PAYMENT_CLIENT_ID:nqd-lms-client-id}
payment.api-key=${PAYMENT_API_KEY:}
payment.checksum-key=${PAYMENT_CHECKSUM_KEY:nqd-lms-checksum-secret-key-32chars}
payment.return-url=${PAYMENT_RETURN_URL:${app.frontend.url}/payment/success}
payment.cancel-url=${PAYMENT_CANCEL_URL:${app.frontend.url}/payment/cancel}
payment.webhook-url=${PAYMENT_WEBHOOK_URL:}
payment.currency=${PAYMENT_CURRENCY:VND}
payment.expiration-minutes=${PAYMENT_EXPIRATION_MINUTES:15}
payment.bank-code=${PAYMENT_BANK_CODE:MB}
payment.account-number=${PAYMENT_ACCOUNT_NUMBER:}
payment.account-name=${PAYMENT_ACCOUNT_NAME:}

# ============================================================
# LARK SUITE ONLINE MEETING & RECORDING CONFIGURATION
# ============================================================
lark.app-id=${LARK_APP_ID:}
lark.app-secret=${LARK_APP_SECRET:}
lark.enabled=${LARK_ENABLED:true}
lark.base-url=${LARK_BASE_URL:https://open.larksuite.com}

# ============================================================
# CLOUDFLARE R2 OBJECT STORAGE (S3-COMPATIBLE)
# ============================================================
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:nqd-lms-recordings}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-r2.nqdlms.online}
cloudflare.r2.enabled=${R2_ENABLED:false}

# ============================================================
# YOUTUBE AUTOMATED UPLOADER CONFIGURATION
# ============================================================
youtube.client-id=${YOUTUBE_CLIENT_ID:}
youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
youtube.refresh-token=${YOUTUBE_REFRESH_TOKEN:}
youtube.enabled=${YOUTUBE_ENABLED:true}

# ============================================================
# GOOGLE WORKSPACE / MEET & DRIVE CONFIGURATION
# ============================================================
google.client-id=${GOOGLE_CLIENT_ID:${youtube.client-id:}}
google.client-secret=${GOOGLE_CLIENT_SECRET:${youtube.client-secret:}}
google.refresh-token=${GOOGLE_REFRESH_TOKEN:${youtube.refresh-token:}}
google.meet.enabled=${GOOGLE_MEET_ENABLED:false}
google.meet.drive-folder-name=${GOOGLE_MEET_DRIVE_FOLDER:Meet Recordings}

# ============================================================
# 100MS LIVE VIDEO & RECORDING CONFIGURATION
# ============================================================
onehundredms.enabled=${ONE_HUNDRED_MS_ENABLED:true}
onehundredms.app-access-key=${ONE_HUNDRED_MS_APP_ACCESS_KEY:}
onehundredms.app-secret=${ONE_HUNDRED_MS_APP_SECRET:}
onehundredms.template-id=${ONE_HUNDRED_MS_TEMPLATE_ID:6abd927f06e552af73ba8f24}
onehundredms.subdomain=${ONE_HUNDRED_MS_SUBDOMAIN:small-forest-267978}
onehundredms.webhook-secret=${ONE_HUNDRED_MS_WEBHOOK_SECRET:}


# ============================================================
# SPRING MAIL / GMAIL SMTP CONFIGURATION
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:namqd1403@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# Google Apps Script Webhook fallback for hosts blocking SMTP ports (e.g. Render Free)
email.http-webhook-url=${EMAIL_WEBHOOK_URL:}

# ============================================================
# WEB PUSH NOTIFICATION (VAPID) CONFIGURATION
# ============================================================
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:admin@nqdlms.online}



