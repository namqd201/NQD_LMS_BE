spring.application.name=NQD_LMS_BE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_learning_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Docker Compose auto-override to use local PostgreSQL
spring.docker.compose.enabled=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# VIRTUAL THREADS & HIGH-CONCURRENCY WEB SERVER (JDK 21)
# ============================================================
spring.threads.virtual.enabled=true

# Embedded Tomcat High-Throughput & I/O Tuning
server.tomcat.max-connections=100000
server.tomcat.accept-count=2000
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ============================================================
# HIKARICP DATABASE CONNECTION POOL OPTIMIZATIONS
# ============================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.pool-name=NqdHikariCP-VThreadPool
spring.datasource.hikari.auto-commit=true


# Google OAuth 2.0 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Session Management (30 days persistence)
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ============================================================
# AI & LLM PROVIDER CONFIGURATION (LangChain4j)
# ============================================================
# Provider Mode: AUTO (auto-detects Gemini / OpenAI key, falls back to offline generator), GEMINI, OPENAI, MOCK_FALLBACK
lms.ai.provider=${LMS_AI_PROVIDER:AUTO}

# 1. Google Gemini API Configuration
lms.ai.gemini.api-key=${GEMINI_API_KEY:}
lms.ai.gemini.model-name=${GEMINI_MODEL:gemini-1.5-flash}

# 2. OpenAI / DeepSeek / Groq / OpenRouter / Local Ollama Configuration
lms.ai.langchain4j.api-key=${OPENAI_API_KEY:}
lms.ai.langchain4j.model-name=${OPENAI_MODEL:gpt-4o-mini}
lms.ai.langchain4j.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ============================================================
# BILLING & PAYMENT GATEWAYS CONFIGURATION (SePay / VietQR / PayOS)
# ============================================================
payment.provider=${PAYMENT_PROVIDER:SEPAY}
payment.client-id=${PAYMENT_CLIENT_ID:nqd-lms-client-id}
payment.api-key=${PAYMENT_API_KEY:}
payment.checksum-key=${PAYMENT_CHECKSUM_KEY:nqd-lms-checksum-secret-key-32chars}
payment.return-url=${PAYMENT_RETURN_URL:${app.frontend.url}/payment/success}
payment.cancel-url=${PAYMENT_CANCEL_URL:${app.frontend.url}/payment/cancel}
payment.webhook-url=${PAYMENT_WEBHOOK_URL:}
payment.currency=${PAYMENT_CURRENCY:VND}
payment.expiration-minutes=${PAYMENT_EXPIRATION_MINUTES:15}
payment.bank-code=${PAYMENT_BANK_CODE:MB}
payment.account-number=${PAYMENT_ACCOUNT_NUMBER:}
payment.account-name=${PAYMENT_ACCOUNT_NAME:}



